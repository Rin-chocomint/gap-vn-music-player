<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIF/Media Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Container utama */
        #gif-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: move;
            border: 2px solid transparent;
            border-radius: 4px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        /* Hover state */
        #gif-container.hovered {
            border-color: rgba(100, 200, 255, 0.5);
            box-shadow: 0 0 15px rgba(100, 200, 255, 0.3);
        }

        /* Dragging state */
        #gif-container.dragging {
            border-color: rgba(100, 200, 255, 0.8);
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.5);
        }

        /* Media surfaces */
        .media-element,
        #media-canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            transition: transform 0.2s ease, opacity 0.15s ease-out;
        }

        #gif-video,
        #gif-audio,
        #media-canvas,
        #audio-badge {
            display: none;
        }

        #gif-audio {
            width: 100%;
        }

        #audio-badge {
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 8px;
            color: rgba(255, 255, 255, 0.88);
            font-family: 'Segoe UI', sans-serif;
            font-size: 12px;
            text-align: center;
            background: rgba(15, 18, 24, 0.78);
            border: 1px solid rgba(100, 200, 255, 0.28);
            border-radius: 8px;
            padding: 10px;
        }

        #audio-badge .audio-icon {
            font-size: 24px;
        }

        /* Resize handle */
        #resize-handle {
            position: absolute;
            right: -1px;
            bottom: -1px;
            width: 22px;
            height: 22px;
            cursor: nwse-resize;
            background: linear-gradient(135deg, transparent 40%, rgba(100, 200, 255, 0.7) 40%);
            opacity: 0;
            transition: opacity 0.15s ease;
            z-index: 10;
            border-radius: 0 0 4px 0;
        }

        #gif-container.hovered #resize-handle,
        #gif-container.dragging #resize-handle {
            opacity: 1;
        }

        /* Rotate Controls */
        #rotate-controls {
            position: absolute;
            left: 0;
            bottom: 0;
            display: flex;
            gap: 2px;
            opacity: 0;
            transition: opacity 0.15s ease;
            z-index: 10;
        }

        #rotate-controls button {
            width: 24px;
            height: 24px;
            border: none;
            background: rgba(100, 200, 255, 0.8);
            color: #000;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.15s ease, transform 0.1s ease;
            padding: 0;
            line-height: 24px;
        }

        #rotate-controls button:hover {
            background: rgba(150, 220, 255, 1);
            transform: scale(1.1);
        }

        #rotate-controls button:active {
            transform: scale(0.95);
        }

        #rotate-controls button:focus {
            outline: none;
        }

        #gif-container.hovered #rotate-controls,
        #gif-container.dragging #rotate-controls {
            opacity: 1;
        }

        #gif-container.no-image #rotate-controls {
            display: none;
        }

        /* Placeholder */
        #placeholder {
            display: none;
            color: rgba(255, 255, 255, 0.8);
            font-family: 'Segoe UI', sans-serif;
            font-size: 13px;
            text-align: center;
            padding: 20px;
            background: rgba(40, 40, 40, 0.9);
            border-radius: 8px;
            cursor: pointer;
        }

        #gif-container.no-image #placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        #gif-container.no-image .media-element,
        #gif-container.no-image #media-canvas,
        #gif-container.no-image #audio-badge {
            display: none;
        }

        .placeholder-icon {
            font-size: 32px;
            opacity: 0.8;
        }

        /* Locked Mode */
        body.locked #gif-container {
            cursor: default;
            border-color: transparent !important;
            box-shadow: none !important;
        }

        body.locked #resize-handle {
            display: none !important;
        }
    </style>
</head>

<body>
    <div id="gif-container" class="no-image">
        <img id="gif-image" class="media-element" src="" alt="Media Overlay">
        <video id="gif-video" class="media-element" playsinline></video>
        <audio id="gif-audio"></audio>
        <canvas id="media-canvas"></canvas>
        <div id="audio-badge">
            <span class="audio-icon">♪</span>
            <span id="audio-label">Audio Overlay</span>
        </div>
        <div id="placeholder">
            <span>Media ilang coba klik ini</span>
        </div>
        <div id="resize-handle"></div>
        <div id="rotate-controls">
            <button id="rotate-left" title="Rotate -15°">↺</button>
            <button id="rotate-right" title="Rotate +15°">↻</button>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        const gifContainer = document.getElementById('gif-container');
        const gifImage = document.getElementById('gif-image');
        const gifVideo = document.getElementById('gif-video');
        const gifAudio = document.getElementById('gif-audio');
        const mediaCanvas = document.getElementById('media-canvas');
        const audioBadge = document.getElementById('audio-badge');
        const audioLabel = document.getElementById('audio-label');
        const resizeHandle = document.getElementById('resize-handle');
        const placeholder = document.getElementById('placeholder');
        const rotateLeftBtn = document.getElementById('rotate-left');
        const rotateRightBtn = document.getElementById('rotate-right');

        let overlayId = null;
        let currentGifPath = null;
        let currentMediaType = 'gif';
        let currentSettings = {};
        let activeMediaElement = gifImage;
        let canvasAnimationFrame = null;
        let lastCanvasFrameTime = 0;
        let isDragging = false;
        let isResizing = false;
        let isLocked = false;
        let currentRotation = 0; // Rotasi saat ini dalam derajat
        let currentFlip = 1; // 1 untuk normal, -1 untuk flip horizontal
        let currentFlipY = 1; // 1 untuk normal, -1 untuk flip vertikal

        // Helper untuk menerapkan semua transformasi
        function updateTransform() {
            const transform = `rotate(${currentRotation}deg) scaleX(${currentFlip}) scaleY(${currentFlipY})`;
            [gifImage, gifVideo, mediaCanvas, audioBadge].forEach(el => {
                if (el) el.style.transform = transform;
            });
        }

        // Inisialisasi dari Main Process
        ipcRenderer.on('init-overlay', (event, { id, path, sourcePath, mediaType, settings, locked, bounds }) => {
            overlayId = id;
            console.log(`[GIF Overlay #${id}] Diinisialisasi, terkunci: ${locked}`);

            currentSettings = settings || currentSettings || {};
            if (path || sourcePath) {
                loadMedia({ path: sourcePath || path, mediaType, settings: currentSettings });
            }

            setLockedState(locked === true);
        });

        ipcRenderer.on('set-rotation', (event, rotation) => {
            currentRotation = rotation;
            updateTransform();
            console.log(`[GIF Overlay #${overlayId}] Rotasi: ${rotation}°`);
        });

        ipcRenderer.on('set-flip', (event, facingRight) => {
            // Jika menghadap kanan = true (default), scaleX(1). Jika tidak, scaleX(-1)
            currentFlip = facingRight ? 1 : -1;
            updateTransform();
        });

        ipcRenderer.on('set-flip-vertical', (event, facingDown) => {
            // Jika menghadap bawah = true (default), scaleY(1). Jika tidak, scaleY(-1)
            currentFlipY = facingDown ? 1 : -1;
            updateTransform();
        });

        // === ROTATE BUTTON HANDLERS ===
        rotateLeftBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (isLocked) return;

            currentRotation = (currentRotation - 15 + 360) % 360;
            updateTransform();
            ipcRenderer.send('gif-overlay-rotate', { id: overlayId, rotation: currentRotation });

            // tetap aktif setelah klik
            gifContainer.classList.add('hovered');
            console.log(`[GIF Overlay #${overlayId}] Rotated left to ${currentRotation}°`);
        });

        rotateRightBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (isLocked) return;

            currentRotation = (currentRotation + 15) % 360;
            updateTransform();
            ipcRenderer.send('gif-overlay-rotate', { id: overlayId, rotation: currentRotation });

            gifContainer.classList.add('hovered');
            console.log(`[GIF Overlay #${overlayId}] Rotated right to ${currentRotation}°`);
        });
        function setLockedState(locked) {
            isLocked = locked;
            if (locked) {
                document.body.classList.add('locked');
                gifContainer.classList.remove('hovered', 'dragging');
            } else {
                document.body.classList.remove('locked');
            }
            console.log(`[GIF Overlay #${overlayId}] Locked state: ${locked}`);
        }

        function inferMediaType(filePath = '') {
            const ext = filePath.split('.').pop()?.toLowerCase() || '';
            if (['mp4', 'webm', 'mov', 'm4v'].includes(ext)) return 'video';
            if (['mp3', 'wav', 'ogg', 'flac', 'aac', 'm4a'].includes(ext)) return 'audio';
            if (['png', 'jpg', 'jpeg', 'webp', 'apng'].includes(ext)) return 'image';
            return 'gif';
        }

        function toFileUrl(filePath) {
            return `file:///${filePath.replace(/\\/g, '/')}`;
        }

        function stopCanvasRenderer() {
            if (canvasAnimationFrame) {
                cancelAnimationFrame(canvasAnimationFrame);
                canvasAnimationFrame = null;
            }
        }

        function hideAllMediaSurfaces() {
            stopCanvasRenderer();
            gifImage.style.display = 'none';
            gifVideo.style.display = 'none';
            gifAudio.style.display = 'none';
            mediaCanvas.style.display = 'none';
            audioBadge.style.display = 'none';
            gifVideo.pause();
            gifAudio.pause();
        }

        function applyMediaSettings(settings = {}) {
            currentSettings = settings || {};
            const effects = currentSettings.effects || {};
            const crop = effects.crop || {};
            const cropClip = `inset(${crop.top || 0}% ${crop.right || 0}% ${crop.bottom || 0}% ${crop.left || 0}%)`;
            const fit = effects.objectFit || 'contain';

            [gifImage, gifVideo, mediaCanvas].forEach(el => {
                el.style.objectFit = fit;
                el.style.clipPath = cropClip;
            });

            const audio = currentSettings.audio || {};
            const volume = Math.max(0, Math.min(1, Number(audio.volume ?? 0.8)));
            gifVideo.volume = volume;
            gifAudio.volume = volume;
            gifVideo.loop = audio.loop !== false;
            gifAudio.loop = audio.loop !== false;

            if (currentMediaType === 'video' || currentMediaType === 'audio') {
                const media = currentMediaType === 'video' ? gifVideo : gifAudio;
                media.ontimeupdate = () => {
                    const end = Number(audio.end || 0);
                    const start = Number(audio.start || 0);
                    if (end > start && media.currentTime >= end) {
                        media.currentTime = start;
                        if (audio.loop !== false) media.play().catch(() => { });
                    }
                };
            }

            // Flip dasar (manual) dari pengguna. Catatan: animasi tipe patrol/DVD
            // tetap bisa menimpa flip horizontal saat berjalan (perilaku yang disengaja).
            currentFlip = currentSettings.flipHorizontal ? -1 : 1;
            currentFlipY = currentSettings.flipVertical ? -1 : 1;
            updateTransform();

            updateCanvasRenderer();
        }

        function updateCanvasRenderer() {
            stopCanvasRenderer();
            const effects = currentSettings.effects || {};
            const chroma = effects.chromaKey || {};
            const sprite = effects.sprite || {};
            const useCanvas = chroma.enabled === true || sprite.enabled === true;

            if (!useCanvas || currentMediaType === 'audio') {
                if (activeMediaElement && currentMediaType !== 'audio') activeMediaElement.style.display = 'block';
                mediaCanvas.style.display = 'none';
                return;
            }

            if (activeMediaElement) activeMediaElement.style.display = 'none';
            mediaCanvas.style.display = 'block';
            const ctx = mediaCanvas.getContext('2d', { willReadFrequently: chroma.enabled === true });
            const source = activeMediaElement;

            const hex = chroma.color || '#00ff00';
            const target = {
                r: parseInt(hex.slice(1, 3), 16) || 0,
                g: parseInt(hex.slice(3, 5), 16) || 255,
                b: parseInt(hex.slice(5, 7), 16) || 0
            };
            const tolerance = Number(chroma.tolerance || 45);
            let spriteFrame = 0;

            function render(now) {
                const fps = sprite.enabled ? Number(sprite.fps || 12) : 30;
                if (now - lastCanvasFrameTime < 1000 / Math.max(1, fps)) {
                    canvasAnimationFrame = requestAnimationFrame(render);
                    return;
                }
                lastCanvasFrameTime = now;

                const sourceWidth = source.videoWidth || source.naturalWidth || source.clientWidth || 1;
                const sourceHeight = source.videoHeight || source.naturalHeight || source.clientHeight || 1;
                mediaCanvas.width = sourceWidth;
                mediaCanvas.height = sourceHeight;
                ctx.clearRect(0, 0, mediaCanvas.width, mediaCanvas.height);

                if (sprite.enabled && source.naturalWidth) {
                    const rows = Math.max(1, Number(sprite.rows || 1));
                    const columns = Math.max(1, Number(sprite.columns || 1));
                    const total = rows * columns;
                    const cellW = Math.floor(source.naturalWidth / columns);
                    const cellH = Math.floor(source.naturalHeight / rows);
                    const sx = (spriteFrame % columns) * cellW;
                    const sy = Math.floor(spriteFrame / columns) * cellH;
                    mediaCanvas.width = cellW;
                    mediaCanvas.height = cellH;
                    ctx.drawImage(source, sx, sy, cellW, cellH, 0, 0, cellW, cellH);
                    spriteFrame = (spriteFrame + 1) % total;
                } else {
                    try {
                        ctx.drawImage(source, 0, 0, mediaCanvas.width, mediaCanvas.height);
                    } catch (e) {
                        canvasAnimationFrame = requestAnimationFrame(render);
                        return;
                    }
                }

                if (chroma.enabled) {
                    const imageData = ctx.getImageData(0, 0, mediaCanvas.width, mediaCanvas.height);
                    const data = imageData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        const dr = data[i] - target.r;
                        const dg = data[i + 1] - target.g;
                        const db = data[i + 2] - target.b;
                        if (Math.sqrt(dr * dr + dg * dg + db * db) <= tolerance) {
                            data[i + 3] = 0;
                        }
                    }
                    ctx.putImageData(imageData, 0, 0);
                }

                canvasAnimationFrame = requestAnimationFrame(render);
            }

            canvasAnimationFrame = requestAnimationFrame(render);
        }

        function loadMedia(payload) {
            const filePath = typeof payload === 'string' ? payload : payload?.path;
            if (!filePath) return;

            currentGifPath = filePath;
            currentMediaType = (typeof payload === 'object' && payload.mediaType) || inferMediaType(filePath);
            currentSettings = (typeof payload === 'object' && payload.settings) || currentSettings || {};
            const mediaUrl = toFileUrl(filePath);

            hideAllMediaSurfaces();

            if (currentMediaType === 'video') {
                activeMediaElement = gifVideo;
                gifVideo.onloadedmetadata = () => {
                    ipcRenderer.send('gif-overlay-media-loaded', {
                        id: overlayId,
                        path: filePath,
                        sourcePath: filePath,
                        mediaType: currentMediaType,
                        naturalWidth: gifVideo.videoWidth || 320,
                        naturalHeight: gifVideo.videoHeight || 180
                    });
                    gifContainer.classList.remove('no-image');
                    gifVideo.style.display = 'block';
                    applyMediaSettings(currentSettings);
                    const start = Number(currentSettings.audio?.start || 0);
                    if (start > 0) gifVideo.currentTime = start;
                    gifVideo.play().catch(() => { });
                };
                gifVideo.onerror = () => {
                    console.error(`[Media Overlay #${overlayId}] Gagal memuat video: ${filePath}`);
                    gifContainer.classList.add('no-image');
                };
                gifVideo.src = mediaUrl;
                gifVideo.loop = true;
                return;
            }

            if (currentMediaType === 'audio') {
                activeMediaElement = gifAudio;
                audioLabel.textContent = filePath.split(/[\\/]/).pop() || 'Audio Overlay';
                gifAudio.onloadedmetadata = () => {
                    ipcRenderer.send('gif-overlay-media-loaded', {
                        id: overlayId,
                        path: filePath,
                        sourcePath: filePath,
                        mediaType: currentMediaType,
                        naturalWidth: 260,
                        naturalHeight: 80
                    });
                    gifContainer.classList.remove('no-image');
                    audioBadge.style.display = 'flex';
                    applyMediaSettings(currentSettings);
                    const start = Number(currentSettings.audio?.start || 0);
                    if (start > 0) gifAudio.currentTime = start;
                    gifAudio.play().catch(() => { });
                };
                gifAudio.onerror = () => {
                    console.error(`[Media Overlay #${overlayId}] Gagal memuat audio: ${filePath}`);
                    gifContainer.classList.add('no-image');
                };
                gifAudio.src = mediaUrl;
                gifAudio.loop = true;
                return;
            }

            activeMediaElement = gifImage;
            const tempImg = new Image();
            tempImg.onload = () => {
                const naturalWidth = tempImg.naturalWidth;
                const naturalHeight = tempImg.naturalHeight;

                ipcRenderer.send('gif-overlay-media-loaded', {
                    id: overlayId,
                    path: filePath,
                    sourcePath: filePath,
                    mediaType: currentMediaType,
                    naturalWidth: naturalWidth,
                    naturalHeight: naturalHeight
                });

                gifImage.src = mediaUrl;
                gifImage.style.display = 'block';
                gifContainer.classList.remove('no-image');
                applyMediaSettings(currentSettings);

                console.log(`[Media Overlay #${overlayId}] Media dimuat: ${filePath} (${naturalWidth}x${naturalHeight})`);
            };
            tempImg.onerror = () => {
                console.error(`[Media Overlay #${overlayId}] Gagal memuat gambar: ${filePath}`);
                gifContainer.classList.add('no-image');
            };
            tempImg.src = mediaUrl;
        }

        function loadGif(filePath) {
            loadMedia({ path: filePath, mediaType: inferMediaType(filePath), settings: currentSettings });
        }

        // === HOVER DETECTION ===
        gifContainer.addEventListener('mouseenter', () => {
            if (!isLocked && !isDragging && !isResizing) {
                gifContainer.classList.add('hovered');
            }
        });

        gifContainer.addEventListener('mouseleave', () => {
            if (!isDragging && !isResizing) {
                gifContainer.classList.remove('hovered');
            }
        });

        // Klik placeholder untuk browse file
        placeholder.addEventListener('click', (e) => {
            e.stopPropagation();
            ipcRenderer.send('gif-overlay-request-file', overlayId);
        });

        // === DRAG LOGIC (Manual via IPC) ===
        gifContainer.addEventListener('mousedown', (e) => {
            if (isLocked) return;
            if (e.target === resizeHandle) return; // Jangan drag jika resize
            if (gifContainer.classList.contains('no-image')) return;

            isDragging = true;
            gifContainer.classList.add('dragging');
            gifContainer.classList.remove('hovered');

            ipcRenderer.send('gif-overlay-drag-start', overlayId);
        });

        // === RESIZE LOGIC ===
        resizeHandle.addEventListener('mousedown', (e) => {
            if (isLocked) return;
            e.preventDefault();
            e.stopPropagation();

            isResizing = true;
            gifContainer.classList.add('dragging');
            document.body.style.cursor = 'nwse-resize';

            ipcRenderer.send('gif-overlay-resize-start', overlayId);
        });

        function finishDrag() {
            if (!isDragging) return;

            isDragging = false;
            gifContainer.classList.remove('dragging');
            ipcRenderer.send('gif-overlay-drag-end', overlayId);
        }

        function finishResize() {
            if (!isResizing) return;

            isResizing = false;
            gifContainer.classList.remove('dragging');
            document.body.style.cursor = '';
            // Hentikan polling main process segera setelah tombol mouse dilepas.
            // Fallback idle di main tetap menangani mouseup yang benar-benar hilang
            // saat pointer keluar dari window transparent.
            ipcRenderer.send('gif-overlay-resize-end', overlayId);
        }

        // === GLOBAL MOUSE MOVE & UP ===
        document.addEventListener('mousemove', (e) => {
            // Posisi drag dan ukuran resize dipantau secara global oleh main
            // process agar satuan koordinatnya selalu sama dengan BrowserWindow.
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                console.log('[GIF Overlay] Drag ended via mouseup');
                finishDrag();
            }

            if (isResizing) {
                console.log('[GIF Overlay] Resize ended via mouseup');
                finishResize();
            }
        });

        // Jika mouseup diterima oleh window tetapi tidak melalui document, tetap
        // hentikan resize. Main process memiliki fallback idle untuk kasus pointer
        // sudah berada di luar window.
        window.addEventListener('mouseup', () => {
            finishDrag();
            finishResize();
        });

        // === IPC HANDLERS ===

        // Variabel untuk cursor proximity opacity (harus dideklarasikan sebelum handlers)
        let currentProximityOpacity = 1.0;
        let targetProximityOpacity = 1.0;
        let opacityAnimationFrame = null;

        function smoothOpacityTransition() {
            const diff = targetProximityOpacity - currentProximityOpacity;
            const step = diff * 0.25; // Smooth easing factor

            if (Math.abs(diff) < 0.01) {
                currentProximityOpacity = targetProximityOpacity;
                [gifImage, gifVideo, mediaCanvas, audioBadge].forEach(el => {
                    if (el) el.style.opacity = currentProximityOpacity;
                });
                opacityAnimationFrame = null;
                return;
            }

            currentProximityOpacity += step;
            [gifImage, gifVideo, mediaCanvas, audioBadge].forEach(el => {
                if (el) el.style.opacity = currentProximityOpacity;
            });
            opacityAnimationFrame = requestAnimationFrame(smoothOpacityTransition);
        }

        ipcRenderer.on('gif-overlay-set-image', (event, filePath) => {
            loadMedia(filePath);
        });

        ipcRenderer.on('set-locked', (event, locked) => {
            setLockedState(locked);
            // Reset opacity ke normal saat unlock
            if (!locked) {
                targetProximityOpacity = 1.0;
                currentProximityOpacity = 1.0;
                [gifImage, gifVideo, mediaCanvas, audioBadge].forEach(el => {
                    if (el) el.style.opacity = 1.0;
                });
                if (opacityAnimationFrame) {
                    cancelAnimationFrame(opacityAnimationFrame);
                    opacityAnimationFrame = null;
                }
            }
        });

        ipcRenderer.on('set-opacity', (event, opacity) => {
            gifContainer.style.opacity = opacity;
            console.log(`[GIF Overlay #${overlayId}] Opacity: ${opacity}`);
        });

        ipcRenderer.on('set-media-effects', (event, settings) => {
            applyMediaSettings(settings || {});
        });

        // (Rotation & Flip handlers moved up)

        ipcRenderer.on('gif-overlay-clear', () => {
            currentGifPath = null;
            hideAllMediaSurfaces();
            gifImage.src = '';
            gifVideo.removeAttribute('src');
            gifAudio.removeAttribute('src');
            gifContainer.classList.add('no-image');
        });

        gifImage.addEventListener('error', () => {
            console.error(`[GIF Overlay #${overlayId}] Error loading image`);
            gifContainer.classList.add('no-image');
        });

        // (Rotate buttons moved up)

        // pastiin button tidak memiliki focus style yang mengganggu
        rotateLeftBtn.addEventListener('mousedown', (e) => e.preventDefault());
        rotateRightBtn.addEventListener('mousedown', (e) => e.preventDefault());

        // === CURSOR PROXIMITY OPACITY HANDLER ===
        ipcRenderer.on('cursor-proximity-opacity', (event, { opacity, isNear }) => {
            targetProximityOpacity = opacity;

            if (!opacityAnimationFrame) {
                opacityAnimationFrame = requestAnimationFrame(smoothOpacityTransition);
            }
        });
    </script>
</body>

</html>
