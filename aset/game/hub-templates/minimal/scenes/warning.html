<!-- ===== Scene: {{SCENE_NAME}} (warning) =====
     Peringatan konten. Tombol data-action="continue" melanjutkan ke menu. -->
    <section class="hub-scene hub-scene-boot m-warning" data-scene-id="{{SCENE_ID}}" data-scene-type="warning" data-scene-name="{{SCENE_NAME}}">
      <div class="m-sheet" data-node="content">
        <header class="m-head">
          <h1 class="m-title" data-node="title">Peringatan Konten</h1>
        </header>
        <p class="m-warning-text" data-node="text">Novel ini mengandung konten yang mungkin sensitif. Disarankan untuk pembaca dewasa. Lanjutkan hanya bila kamu setuju.</p>
        <div class="m-warning-actions">
          <button type="button" class="m-btn" data-node="continue-btn" data-action="continue">Saya Mengerti</button>
        </div>
      </div>
    </section>
