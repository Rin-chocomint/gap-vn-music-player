<!-- ===== Scene: {{SCENE_NAME}} (splash) =====
     Layar pembuka. Auto-lanjut sesuai data-duration (ms) atau klik untuk skip. -->
    <section class="hub-scene hub-scene-boot tpl-splash" data-scene-id="{{SCENE_ID}}" data-scene-type="splash" data-scene-name="{{SCENE_NAME}}" data-duration="3000">
      <div class="tpl-splash-inner" data-node="content">
        <h1 class="tpl-splash-title" data-node="title" data-bind="title">Visual Novel</h1>
        <p class="tpl-splash-sub" data-node="tagline" data-bind="storyDesc"></p>
      </div>
      <p class="tpl-splash-skip" data-node="skip-hint">Klik untuk lanjut &rarr;</p>
    </section>
