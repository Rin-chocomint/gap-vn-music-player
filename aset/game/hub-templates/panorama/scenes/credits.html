<!-- ===== Scene: {{SCENE_NAME}} (credits) =====
     Daftar kredit. Dicapai dari menu via goto, kembali via back. -->
    <section class="hub-scene pn-credits-scene" data-scene-id="{{SCENE_ID}}" data-scene-type="credits" data-scene-name="{{SCENE_NAME}}">
      <div class="pn-shade"></div>
      <div class="pn-panel" data-node="content">
        <h1 class="pn-title" data-node="title">Credits</h1>
        <div class="pn-hairline"></div>
        <div class="pn-credits" data-node="lines">
          <p>Cerita &amp; Naskah &mdash; <span data-bind="author">&mdash;</span></p>
          <p>Ilustrasi &mdash; <span data-bind="illustrator">&mdash;</span></p>
          <p>VN Mapper &mdash; <span data-bind="vnMapper">&mdash;</span></p>
        </div>
        <button type="button" class="pn-btn" data-node="back-btn" data-action="back">&larr; Kembali</button>
      </div>
    </section>
