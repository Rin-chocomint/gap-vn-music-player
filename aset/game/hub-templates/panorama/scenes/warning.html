<!-- ===== Scene: {{SCENE_NAME}} (warning) =====
     Peringatan konten. Tombol data-action="continue" melanjutkan ke menu. -->
    <section class="hub-scene hub-scene-boot pn-warning" data-scene-id="{{SCENE_ID}}" data-scene-type="warning" data-scene-name="{{SCENE_NAME}}">
      <div class="pn-shade"></div>
      <div class="pn-panel" data-node="content">
        <h1 class="pn-title" data-node="title">Peringatan Konten</h1>
        <div class="pn-hairline"></div>
        <p class="pn-prose" data-node="text">Novel ini mengandung konten yang mungkin sensitif. Disarankan untuk pembaca dewasa. Lanjutkan hanya bila kamu setuju.</p>
        <button type="button" class="pn-btn" data-node="continue-btn" data-action="continue">Saya Mengerti</button>
      </div>
    </section>
