<!-- ===== Scene: {{SCENE_NAME}} (warning) =====
     Peringatan konten (boot). Menunggu tombol data-action="continue" untuk lanjut. -->
    <section class="hub-scene hub-scene-boot sc-warning" data-scene-id="{{SCENE_ID}}" data-scene-type="warning" data-scene-name="{{SCENE_NAME}}">
      <div class="sc-warning-box" data-node="box">
        <h2 class="sc-warning-title" data-node="title">Peringatan Konten</h2>
        <p class="sc-warning-text" data-node="text">Novel ini dapat memuat tema dewasa, kekerasan, atau bahasa kasar.
          Lanjutkan hanya bila kamu merasa sesuai.</p>
        <button type="button" class="sc-btn sc-btn-primary" data-node="continue-btn" data-action="continue">Saya Mengerti</button>
      </div>
    </section>
