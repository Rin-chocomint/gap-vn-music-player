<!-- ===== Scene: {{SCENE_NAME}} (custom_code → Galeri) =====
     Layar custom: diisi hub.js via VNHub.getGalleryImages() saat pertama dibuka.
     Dicapai dari menu (data-hub-nav="gallery"), kembali via data-action="back". -->
    <section class="hub-scene sc-screen sc-gallery" data-scene-id="{{SCENE_ID}}" data-scene-type="custom_code" data-scene-name="{{SCENE_NAME}}" data-hub-screen="gallery">
      <div class="sc-screen-head">
        <button type="button" class="sc-btn sc-back" data-node="back-btn" data-action="back">&larr; Kembali</button>
        <h2 class="sc-screen-title" data-node="title">Galeri</h2>
      </div>
      <div class="sc-gallery-grid" data-node="grid" data-hub-slot="gallery-grid">
        <p class="sc-empty">Memuat galeri&hellip;</p>
      </div>
    </section>
