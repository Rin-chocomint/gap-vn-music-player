<!-- ===== Scene: {{SCENE_NAME}} (splash) =====
     Layar pembuka (boot). Otomatis lanjut setelah data-duration ms, atau saat diklik.
     Gambar diisi dari cover novel via data-bind-asset; ganti <img> sesukamu. -->
    <section class="hub-scene hub-scene-boot sc-splash" data-scene-id="{{SCENE_ID}}" data-scene-type="splash" data-scene-name="{{SCENE_NAME}}" data-duration="3000">
      <img class="sc-splash-logo" data-node="logo" data-bind-asset="cover" alt="">
      <p class="sc-splash-hint" data-node="hint">Klik untuk lewati</p>
    </section>
