<!-- ===== Scene: {{SCENE_NAME}} (warning) =====
     Peringatan konten. Tombol data-action="continue" melanjutkan ke menu. -->
    <section class="hub-scene hub-scene-boot sp-scene-read" data-scene-id="{{SCENE_ID}}" data-scene-type="warning" data-scene-name="{{SCENE_NAME}}">
      <div class="sp-shade"></div>
      <div class="sp-content sp-panel" data-node="content">
        <h1 class="sp-title" data-node="title" style="font-size: clamp(1.6rem, 3vw, 2.6rem);">Peringatan Konten</h1>
        <p class="sp-prose" data-node="text">Novel ini mengandung konten yang mungkin sensitif. Disarankan untuk pembaca dewasa. Lanjutkan hanya bila kamu setuju.</p>
        <button type="button" class="sp-btn" data-node="continue-btn" data-action="continue">Saya Mengerti</button>
      </div>
    </section>
