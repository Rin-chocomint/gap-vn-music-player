<!-- ===== Scene: {{SCENE_NAME}} (warning) =====
     Peringatan konten. Tombol data-action="continue" melanjutkan ke menu. -->
    <section class="hub-scene hub-scene-boot tpl-warning" data-scene-id="{{SCENE_ID}}" data-scene-type="warning" data-scene-name="{{SCENE_NAME}}">
      <div class="tpl-warning-box" data-node="content">
        <h2 class="tpl-warning-head" data-node="title">Peringatan Konten</h2>
        <p class="tpl-warning-text" data-node="text">Novel ini mengandung konten yang mungkin sensitif. Disarankan untuk pembaca dewasa. Lanjutkan hanya bila kamu setuju.</p>
        <button type="button" class="tpl-btn tpl-btn-primary" data-node="continue-btn" data-action="continue">Saya Mengerti</button>
      </div>
    </section>
