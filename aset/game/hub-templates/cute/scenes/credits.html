<!-- ===== Scene: {{SCENE_NAME}} (credits) =====
     Daftar kredit. Dicapai dari menu via goto, kembali via back. -->
    <section class="hub-scene tpl-credits" data-scene-id="{{SCENE_ID}}" data-scene-type="credits" data-scene-name="{{SCENE_NAME}}">
      <div class="tpl-credits-inner" data-node="content">
        <h2 class="tpl-credits-title" data-node="title">Credits</h2>
        <div class="tpl-credits-lines" data-node="lines">
          <p>Cerita &amp; Naskah &mdash; <span data-bind="author">&mdash;</span></p>
          <p>Ilustrasi &mdash; <span data-bind="illustrator">&mdash;</span></p>
          <p>VN Mapper &mdash; <span data-bind="vnMapper">&mdash;</span></p>
          <p class="tpl-credits-footer">Dibuat dengan GAP VN Player</p>
        </div>
        <button type="button" class="tpl-btn" data-node="back-btn" data-action="back">&larr; Kembali</button>
      </div>
    </section>
